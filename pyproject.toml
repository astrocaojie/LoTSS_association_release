[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotss-association"
version = "0.1.0"
description = "Rule-based LoTSS Gaussian-component association pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Cao Jie"}
]
keywords = ["LoTSS", "LOFAR", "radio astronomy", "source association", "PyBDSF"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
  "astropy>=5.3",
  "astroquery>=0.4.7",
  "h5py>=3.8",
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "pyarrow>=12.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.2",
  "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5"
]
pybdsf = [
  "bdsf"
]

[project.urls]
Homepage = "https://github.com/astrocaojie/LoTSS_association"
Repository = "https://github.com/astrocaojie/LoTSS_association"
Issues = "https://github.com/astrocaojie/LoTSS_association/issues"

[tool.setuptools.packages.find]
include = ["lotss_association*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
