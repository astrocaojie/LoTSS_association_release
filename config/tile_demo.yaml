tile_id: lotss_dr3_0_stokesI_fullres

# Real LoTSS tile demo configured from the production manifest.
radio_image: data/example/lotss_dr3_0_stokesI_fullres.fits
gaussian_catalogue: data/example/lotss_dr3_0_stokesI_fullres.pybdsf.gaul.fits
rms_map: null
output_dir: outputs/baseline_demo/lotss_dr3_0_demo

radio_hdu: null
rms_hdu: null

demo_region:
  enabled: true
  mode: pixel_box   # pixel_box / sky_box / full_tile
  xmin: 1024
  xmax: 3072
  ymin: 12288
  ymax: 14336
  padding_pixels: 32

max_components: null
random_seed: 42

manual_labels: baseline_demo/outputs/manual_labels.csv

mean_mode: median
rms_mode: mad
use_catalogue_rms_for_snr: true
smooth_before_segmentation: true
gaussian_smooth_sigma_pix: 1.0

snr_thresholds: [5.0, 4.0, 3.0, 2.5, 2.0]
min_mask_area_pix: 20
connectivity: 2
binary_opening: false
binary_closing: true

beam:
  major_arcsec: 6.0
  minor_arcsec: 6.0
  pa_deg: 0.0

neighbour_search:
  max_distance_beam: 15.0
  method: ckdtree

distance_baseline:
  thresholds_beam: [1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0]
  match_full_multi_group_count: true
  matched_threshold_step: 0.1

contour_baseline:
  sigma_threshold: 3.0
  pixel_connectivity: 8
  min_mask_area_pixels: 1
  component_assignment_tolerance_pixels: 0

association:
  enabled: true
  max_pair_distance_beam: 15.0
  threshold_strong: 3.0
  threshold_weak: 2.0
  use_connected_components_for_strong_edges: true
  weak_edges_attach_only: true
  min_bridge_width_beam: 0.8
  min_bridge_length_beam: 1.0
  max_only_2sigma_score: 0.5
  quality_thresholds:
    high: 3.5
    medium: 2.5
    low: 1.5

weights_association:
  closeness: 1.0
  overlap: 1.0
  pa_alignment: 0.8
  conn_3sigma: 1.5
  conn_2p5sigma: 0.6
  conn_2sigma: 0.0
  bridge: 1.2
  ridge: 1.2
  flux_continuity: 0.5
  flow_alignment: 0.6
  valley: 1.5
  only_2sigma: 1.0
  negative_bowl: 1.2
  sidelobe: 1.5
  too_far: 2.0
  large_mask_swallow: 1.5

association_types:
  compact_multi_gaussian:
    max_las_beam: 4.0
  continuous_extended:
    min_las_beam: 4.0
  diffuse_extended:
    min_las_beam: 6.0
  linear_or_tail_like:
    min_axis_ratio: 2.0
  complex_association:
    min_components: 5
  weak_association:
    max_quality: low
  artifact_risk:
    enabled: true
